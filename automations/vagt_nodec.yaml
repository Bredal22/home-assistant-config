- id: gp_vagt_refresh_15_min
  alias: GP vagt – opdater kalender hver 2. time
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/30"
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: calendar.gp_vagt

- alias: "Opdater NodeC position"
  trigger:
    - trigger: mqtt
      topic: "msh/EU_868/2/json/AllanMesh/!1ba2de60"
  condition:
    - condition: template
      value_template: >
        {{ trigger.payload_json.type == 'position'
           and trigger.payload_json.from == 463840120 }}
  action:
    - action: device_tracker.see
      data:
        dev_id: nodec_bil
        gps:
          - "{{ trigger.payload_json.payload.latitude_i | float / 10000000 }}"
          - "{{ trigger.payload_json.payload.longitude_i | float / 10000000 }}"
        gps_accuracy: 10
        source_type: gps
