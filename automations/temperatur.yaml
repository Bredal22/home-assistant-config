- id: "1672175070779"
  alias: TT overvågning køleskab
  description: ""
  mode: single

  triggers:
    - trigger: state
      entity_id: sensor.koleskab_temperature
      for: "01:00:00"

  conditions: []

  actions:
    - action: notify.mobile_app_sm_s938b
      data:
        message: "Kontroller køleskab TT"

- id: "1672175158424"
  alias: "TT overvågning stue AirThings"
  description: ""
  mode: single

  triggers:
    - trigger: state
      entity_id: sensor.stue_temperature
      for: "01:00:00"

  conditions: []

  actions:
    - action: notify.mobile_app_sm_s938b
      data:
        message: "Kontroller stue AirThings"

- id: "1672207136531"
  alias: Temperaturovervågning køleskab
  description: ""
  mode: single

  triggers:
    - trigger: numeric_state
      entity_id: sensor.koleskab_temperature
      above: 7
      for: "00:00:01"

  conditions: []

  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.3

    - action: notify.mobile_app_sm_s938b
      data:
        message: "Temperatur i køleskab udenfor interval"

    - repeat:
        count: 4
        sequence:
          - action: media_player.play_media
            target:
              entity_id: media_player.kitchen
            data:
              media_content_id: >-
                media-source://tts/google_translate?message=Temperature+in+refrigerator+too+high
              media_content_type: provider
          - delay: "00:00:20"
