- id: c3_silkeborg_tts_koretid
  alias: Silkeborg udkald – TTS med køretid
  description: TTS 30 sek efter udkald (kræver vagt) med køretid til alarm-adresse
  mode: restart

  triggers:
    - trigger: state
      entity_id: input_boolean.udkald_silkeborg
      from: "off"
      to: "on"

  conditions: []

  actions:
    # Kun når du har vagt (switch.vagt OR input_boolean.vagt)
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.vagt
          state: "on"
        - condition: state
          entity_id: input_boolean.vagt
          state: "on"

    - delay: "00:00:30"

    # Tjek igen efter delay (samme som før)
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.vagt
          state: "on"
        - condition: state
          entity_id: input_boolean.vagt
          state: "on"

    - variables:
        alarm_title: "{{ states('sensor.c3_alarm_0_titel') | default('ukendt alarm') }}"
        dest_addr: "{{ states('sensor.c3_alarm_0_adresse_waze') }}"
        alarm_address: >-
          {{ states('sensor.c3_alarm_0_adresse')
             if states('sensor.c3_alarm_0_adresse') not in ['—','unknown','unavailable','']
             else dest_addr }}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ dest_addr not in ['—','unknown','unavailable',''] }}"
          sequence:
            - action: waze_travel_time.get_travel_times
              data:
                region: "eu"
                units: "metric"
                vehicle_type: "car"
                origin: zone.home
                destination: "{{ dest_addr }}"
                realtime: true
              response_variable: waze

            - variables:
                drive_minutes: >-
                  {% set d = 0 %}
                  {% if waze is defined and waze.routes is defined and (waze.routes | count) > 0 %}
                    {% set d = waze.routes[0].duration | float(0) %}
                  {% endif %}
                  {{ d | round(0) | int(0) }}

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ drive_minutes > 0 }}"
                  sequence:
                    - action: notify.mobile_app_sm_s938b
                      data:
                        message: "TTS"
                        data:
                          tts_text: >-
                            Du kører til "{{ alarm_title }}". Adressen er {{ alarm_address }}.
                            Køretiden er {{ drive_minutes }} minutter.
                          media_stream: alarm_stream
                          ttl: 0
                          priority: high
              default:
                - action: notify.mobile_app_sm_s938b
                  data:
                    message: "TTS"
                    data:
                      tts_text: >-
                        Du kører til "{{ alarm_title }}". Adressen er {{ alarm_address }}.
                        Køretiden er ukendt.
                      media_stream: alarm_stream
                      ttl: 0
                      priority: high
      default:
        - action: notify.mobile_app_sm_s938b
          data:
            message: "TTS"
            data:
              tts_text: >-
                Du kører til "{{ alarm_title }}". Adressen er {{ alarm_address }}.
                Køretiden er ukendt.
              media_stream: alarm_stream
              ttl: 0
              priority: high

- id: c3_watchdog_fejl
  alias: C3 – watchdog ved fejl
  description: Giv besked hvis C3 har været nede i mindst 10 minutter
  mode: single

  triggers:
    - trigger: state
      entity_id: binary_sensor.c3_ok
      to: "off"
      for:
        minutes: 10

  conditions:
    - condition: state
      entity_id: input_boolean.c3_enabled
      state: "on"

  actions:
    - action: notify.mobile_app_sm_s938b
      data:
        title: "C3-fejl (watchdog)"
        message: >-
          C3 har været nede i mindst 10 minutter.
          Status: {{ states('sensor.c3_status') }}.
          Sidst opdateret: {{ state_attr('sensor.c3_sidst_opdateret', 'last_update_local') }}

    - action: persistent_notification.create
      data:
        title: "C3-fejl"
        message: >-
          C3 OK: {{ states('binary_sensor.c3_ok') }}
          Sidst opdateret: {{ state_attr('sensor.c3_sidst_opdateret', 'last_update_local') }}

