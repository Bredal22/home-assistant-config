# LoRa
- alias: "Opdater NodeC position"
  trigger:
    - trigger: mqtt
      topic: "msh/EU_868/2/json/AllanMesh/!1ba2de60"
  condition:
    - condition: template
      value_template: >
        {{ trigger.payload_json.type == 'position' 
           and trigger.payload_json.from == 463840120 }}
  action:
    - action: device_tracker.see
      data:
        dev_id: nodec_bil
        gps:
          - "{{ trigger.payload_json.payload.latitude_i | float / 10000000 }}"
          - "{{ trigger.payload_json.payload.longitude_i | float / 10000000 }}"
        gps_accuracy: 10
        source_type: gps
