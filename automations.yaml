- id: '1672207136531'
  alias: Temperaturovervågning køleskab
  description: ''
  trigger:
  - type: temperature
    platform: device
    device_id: 0355a8c2d9964d0eb7f8afc022faa423
    entity_id: sensor.koleskab_temperature
    domain: sensor
    above: 7
    for:
      hours: 0
      minutes: 0
      seconds: 1
  condition: []
  action:
  - service: media_player.volume_set
    data:
      volume_level: 0.3
    target:
      entity_id: media_player.kitchen
  - device_id: dc33b51eb7313711b712c98af3a202b0
    domain: mobile_app
    type: notify
    message: Temperatur i køleskab udenfor interval
  - repeat:
      count: '4'
      sequence:
      - service: media_player.play_media
        target:
          entity_id: media_player.kitchen
        data:
          media_content_id: media-source://tts/google_translate?message=Temperature+in+refrigerator+too+high
          media_content_type: provider
        metadata:
          title: Temperature in refrigerator too high
          thumbnail: https://brands.home-assistant.io/_/google_translate/logo.png
          media_class: app
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://tts
          - media_content_type: provider
            media_content_id: media-source://tts/google_translate?message=Temperature+in+refrigerator+too+high
      - delay:
          hours: 0
          minutes: 0
          seconds: 20
          milliseconds: 0
  mode: single
