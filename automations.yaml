- id: "1672207136531"
  alias: Temperaturovervågning køleskab
  description: ""
  mode: single

  triggers:
    - trigger: numeric_state
      entity_id: sensor.koleskab_temperature
      above: 7
      for: "00:00:01"

  conditions: []

  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.3

    - action: notify.mobile_app_sm_s938b
      data:
        message: "Temperatur i køleskab udenfor interval"

    - repeat:
        count: 4
        sequence:
          - action: media_player.play_media
            target:
              entity_id: media_player.kitchen
            data:
              media_content_id: >-
                media-source://tts/google_translate?message=Temperature+in+refrigerator+too+high
              media_content_type: provider
          - delay: "00:00:20"

- id: 5d8cdd0de7964cd996cc99e48d7bf80c
  alias: "C3: Opdater straks ved aktivering"
  mode: single

  triggers:
    - trigger: state
      entity_id: input_boolean.c3_enabled
      from: "off"
      to: "on"

  conditions: []

  actions:
    # 1) Hent token først
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.c3_access_token

    # 2) Vent til token-attributten faktisk er der (undgår tomt/401)
    - wait_template: >-
        {{ (state_attr('sensor.c3_access_token','access_token') | default('') | length) > 0 }}
      timeout: "00:00:10"
      continue_on_timeout: true

    # 3) Opdatér alarmer + deltid-sensor
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.c3_alarmer_antal
          - sensor.c3_alarm_0
          - sensor.c3_alarm_1
          - sensor.c3_alarm_2
          - sensor.c3_deltid_seneste_aendring

- id: 3ee036fe1df04b2e8add15f5ca73a328
  alias: "C3: Poll token (4 min)"
  mode: single

  triggers:
    - trigger: time_pattern
      minutes: "/4"

  conditions:
    - condition: state
      entity_id: input_boolean.c3_enabled
      state: "on"
    - condition: template
      value_template: "{{ states('sensor.c3_access_token') not in ['unknown','unavailable'] }}"

  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.c3_access_token

- id: c3_update_token_on_start
  alias: C3 - Opdater token ved opstart
  mode: single

  triggers:
    - trigger: homeassistant
      event: start

  conditions:
    - condition: state
      entity_id: input_boolean.c3_enabled
      state: "on"

  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.c3_access_token

- id: c3_update_alarms_every_30s
  alias: C3 - Opdater alarmer hvert 30. sekund
  mode: restart

  triggers:
    - trigger: time_pattern
      seconds: "/30"

  conditions:
    - condition: state
      entity_id: input_boolean.c3_enabled
      state: "on"
    - condition: state
      entity_id: sensor.c3_access_token
      state: "OK"

  actions:
    # (Anbefalet) refresh token før data-kald – så får du ikke "Empty reply"/401 når token løber ud
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.c3_access_token

    - wait_template: >-
        {{ (state_attr('sensor.c3_access_token','access_token') | default('') | length) > 0 }}
      timeout: "00:00:10"
      continue_on_timeout: true

    # Opdatér alarm_0 + deltid (og evt. antal hvis du vil)
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.c3_alarm_0
          - sensor.c3_deltid_seneste_aendring
          # - sensor.c3_alarmer_antal

- id: "1763468099555"
  alias: Silkeborg – C3 alarm 0 notifikation
  description: Send notifikation når Silkeborg rykker ud på C3 alarm 0
  mode: parallel

  triggers:
    - trigger: state
      entity_id: sensor.c3_alarm_0_tidspunkt_lokal

  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and
        trigger.to_state is not none and
        trigger.from_state.state not in ['unknown', 'unavailable', '—'] and
        trigger.to_state.state not in ['unknown', 'unavailable', '—'] }}

  actions:
    - wait_template: >-
        {{ 'Silkeborg' in (states('sensor.c3_alarm_0_stationer') or '') }}
      timeout: "00:06:00"
      continue_on_timeout: false

    - action: notify.mobile_app_sm_s938b
      data:
        title: >-
          🚒 {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }} kører
        message: >-
          {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }}
          kører til {{ states('sensor.c3_alarm_0_adresse') | default(states('sensor.c3_alarm_0_titel')) }}
          kl. {{ states('sensor.c3_alarm_0_tidspunkt_lokal') }}.

          Alarm: {{ states('sensor.c3_alarm_0_titel') }}
        data:
          ttl: 0
          priority: high
          channel: c3_standard
          clickAction: >-
            {% set dest = states('sensor.c3_alarm_0_adresse')
              if states('sensor.c3_alarm_0_adresse') not in ['—','unknown','unavailable','']
              else states('sensor.c3_alarm_0_titel') %}
            https://www.google.com/maps/dir/?api=1&destination={{ dest | urlencode }}

