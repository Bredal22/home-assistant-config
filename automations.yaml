- id: 5d8cdd0de7964cd996cc99e48d7bf80c
  alias: 'C3: Opdater straks ved aktivering'
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.c3_enabled
    to: 'on'
  condition: []
  action:
  - service: homeassistant.update_entity
    target:
      entity_id:
      - sensor.c3_access_token
      - sensor.c3_alarmer_antal
      - sensor.c3_alarm_0
      - sensor.c3_alarm_1
      - sensor.c3_alarm_2
- id: 3ee036fe1df04b2e8add15f5ca73a328
  alias: 'C3: Poll token (4 min)'
  mode: single
  trigger:
  - platform: time_pattern
    minutes: /4
  condition:
  - condition: state
    entity_id: input_boolean.c3_enabled
    state: 'on'
  action:
  - service: homeassistant.update_entity
    target:
      entity_id: sensor.c3_access_token
- id: c3_update_token_on_start
  alias: C3 - Opdater token ved opstart
  trigger:
  - platform: homeassistant
    event: start
  condition:
  - condition: state
    entity_id: input_boolean.c3_enabled
    state: 'on'
  action:
  - service: homeassistant.update_entity
    target:
      entity_id: sensor.c3_access_token
- id: c3_update_alarms_every_30s
  alias: C3 - Opdater alarmer hvert 30. sekund
  trigger:
  - platform: time_pattern
    seconds: /30
  mode: restart
  condition:
  - condition: state
    entity_id: input_boolean.c3_enabled
    state: 'on'
  - condition: state
    entity_id: sensor.c3_access_token
    state: OK
  action:
  - service: homeassistant.update_entity
    target:
      entity_id: sensor.c3_alarm_0
- id: '1763468099555'
  alias: Silkeborg – C3 alarm 0 notifikation
  description: Send notifikation når Silkeborg rykker ud på C3 alarm 0
  triggers:
  - entity_id: sensor.c3_alarm_0_tidspunkt_lokal
    trigger: state
  conditions: []
  actions:
  - wait_template: '{{ ''Silkeborg'' in (states(''sensor.c3_alarm_0_stationer'') or
      '''') }}

      '
    timeout: 00:06:00
    continue_on_timeout: false
  - data:
      title: "\U0001F692 {{ states('sensor.c3_alarm_0_stationer') | default('Station
        ukendt') }} kører\n"
      message: '{{ states(''sensor.c3_alarm_0_stationer'') | default(''Station ukendt'')
        }} kører til {{ states(''sensor.c3_alarm_0_adresse'') | default(states(''sensor.c3_alarm_0_titel''))
        }} kl. {{ states(''sensor.c3_alarm_0_tidspunkt_lokal'') }}.

        Alarm: {{ states(''sensor.c3_alarm_0_titel'') }}

        '
      data:
        ttl: 0
        priority: high
        channel: c3_standard
    action: notify.mobile_app_sm_s908b
  mode: parallel
- id: '1763468769647'
  alias: Alle stationer – C3 alarm 0 notifikation
  description: Send notifikation når C3 alarm 0 skifter til ny melding
  trigger:
  - platform: state
    entity_id: sensor.c3_alarm_0_tidspunkt_lokal
  condition:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n   and trigger.to_state is
      not none\n   and trigger.from_state.state not in ['unknown', 'unavailable',
      '—']\n   and trigger.to_state.state not in ['unknown', 'unavailable', '—'] }}\n"
  action:
  - service: notify.mobile_app_sm_s908b
    data:
      title: '{{ states(''sensor.c3_alarm_0_stationer'') | default(''Station ukendt'')
        }} kører

        '
      message: '{{ states(''sensor.c3_alarm_0_stationer'') | default(''Station ukendt'')
        }} kører til {{ states(''sensor.c3_alarm_0_adresse'') | default(states(''sensor.c3_alarm_0_titel''))
        }} kl. {{ states(''sensor.c3_alarm_0_tidspunkt_lokal'') }}.

        Alarm: {{ states(''sensor.c3_alarm_0_titel'') }}

        '
  mode: single
- id: '1763468099600'
  alias: Flag – Udkald Silkeborg
  description: Sæt input_boolean.udkald_silkeborg ved udkald til Silkeborg
  trigger:
  - platform: state
    entity_id: sensor.c3_alarm_0_tidspunkt_lokal
  condition:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n   and trigger.to_state is
      not none\n   and trigger.from_state.state not in ['unknown', 'unavailable',
      '—']\n   and trigger.to_state.state not in ['unknown', 'unavailable', '—'] }}\n"
  action:
  - wait_template: '{{ ''Silkeborg'' in (states(''sensor.c3_alarm_0_stationer'') or
      '''') }}

      '
    timeout: 00:02:00
    continue_on_timeout: false
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.udkald_silkeborg
  - delay: 00:00:10
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.udkald_silkeborg
  mode: restart
- id: '1763468099601'
  alias: Silkeborg udkald – Lys ved hoveddør og indkørsel
  description: Tænd lys ved udkald til Silkeborg når det er mørkt og jeg har vagt
  trigger:
  - platform: state
    entity_id: input_boolean.udkald_silkeborg
    from: 'off'
    to: 'on'
  condition:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: switch.vagt
    state: 'on'
  action:
  - service: switch.turn_on
    target:
      entity_id:
      - switch.hoveddoer_og_carport
      - switch.indkoersel
  - delay: 00:05:00
  - service: switch.turn_off
    target:
      entity_id:
      - switch.hoveddoer_og_carport
      - switch.indkoersel
  mode: restart
