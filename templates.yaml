- sensor:
    # --- PFA Total ---
    - name: "PFA"
      unique_id: pfa_total
      unit_of_measurement: "kr"
      state_class: measurement
      state: >-
        {{ (state_attr('sensor.yahoofinance_pfigla_co','regularMarketPrice') | float * 606 )
           + (state_attr('sensor.yahoofinance_pfibaa_co','regularMarketPrice') | float * 2089) }}

    # --- Udendørs temperatur ---
    - name: "temperature_ext"
      unique_id: weather_home_temp
      device_class: temperature
      unit_of_measurement: "°C"
      state_class: measurement
      state: "{{ state_attr('weather.home', 'temperature') }}"
      availability: "{{ state_attr('weather.home', 'temperature') is not none }}"
      attributes:
        friendly_name: "Udendørs temperatur"

    # --- Udendørs luftfugtighed ---
    - name: "humidity_ext"
      unique_id: weather_home_humid
      device_class: humidity
      unit_of_measurement: "%"
      state_class: measurement
      state: "{{ state_attr('weather.home', 'humidity') }}"
      availability: "{{ state_attr('weather.home', 'humidity') is not none }}"
      attributes:
        friendly_name: "Udendørs luftfugtighed"

    # --- C3: sensorer pr. indeks ---

    # Alarm 0 - med selv-hold hvis data kortvarigt forsvinder
    - name: "C3 alarm 0 titel"
      unique_id: c3_alarm_0_title
      icon: mdi:alarm-light
      state: >-
        {% set a = state_attr('sensor.c3_alarm_0', 'firstReportsWordingText') %}
        {% if a not in [none, 'unknown', 'unavailable', ''] %}
          {{ a }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          Alarm #{{ states('sensor.c3_alarm_0') }}
        {% endif %}

    - name: "C3 alarm 0 adresse"
      unique_id: c3_alarm_0_address
      icon: mdi:map-marker
      state: >-
        {% set v = state_attr('sensor.c3_alarm_0', 'address') %}
        {% if v not in [none, 'unknown', 'unavailable', ''] %}
          {{ v }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    - name: "C3 alarm 0 stationer"
      unique_id: c3_alarm_0_stations
      icon: mdi:fire-station
      state: >-
        {% set v = state_attr('sensor.c3_alarm_0', 'stationNames') %}
        {% if v not in [none, 'unknown', 'unavailable', ''] %}
          {{ v }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    - name: "C3 alarm 0 køretøjer"
      unique_id: c3_alarm_0_vehicles
      icon: mdi:fire-truck
      state: >-
        {% set v = state_attr('sensor.c3_alarm_0', 'vehicleNames') %}
        {% if v not in [none, 'unknown', 'unavailable', ''] %}
          {{ v }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    # Alarm 0 – tidspunkt (lokal)
    - name: "C3 alarm 0 tidspunkt (lokal)"
      unique_id: c3_alarm_0_time_local
      icon: mdi:clock-outline
      state: >-
        {% set t = state_attr('sensor.c3_alarm_0', 'alarmTime') %}
        {% if t not in [none, 'unknown', 'unavailable', ''] %}
          {{ as_timestamp(t) | timestamp_custom("%Y-%m-%d %H:%M:%S") }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    # Alarm 1
    - name: "C3 alarm 1 titel"
      unique_id: c3_alarm_1_title
      icon: mdi:alarm-light
      state: >-
        {% set a = state_attr('sensor.c3_alarm_1','firstReportsWordingText') %}
        {% if a %}{{ a }}{% else %}Alarm #{{ states('sensor.c3_alarm_1') }}{% endif %}

    - name: "C3 alarm 1 adresse"
