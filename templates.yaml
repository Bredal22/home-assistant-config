        {% endif %}

    # Alarm 0 – modtaget fra
    - name: "C3 alarm 0 modtaget fra"
      unique_id: c3_alarm_0_received_from
      icon: mdi:phone-incoming
      state: "{{ state_attr('sensor.c3_alarm_0','alarmReceivedFromText') or '—' }}"

    # Alarm 1 – modtaget fra
    - name: "C3 alarm 1 modtaget fra"
      unique_id: c3_alarm_1_received_from
      icon: mdi:phone-incoming
      state: "{{ state_attr('sensor.c3_alarm_1','alarmReceivedFromText') or '—' }}"

    # Alarm 2 – modtaget fra
    - name: "C3 alarm 2 modtaget fra"
      unique_id: c3_alarm_2_received_from
      icon: mdi:phone-incoming
      state: "{{ state_attr('sensor.c3_alarm_2','alarmReceivedFromText') or '—' }}"

    # Alarm 3 – modtaget fra
    - name: "C3 alarm 3 modtaget fra"
      unique_id: c3_alarm_3_received_from
      icon: mdi:phone-incoming
      state: "{{ state_attr('sensor.c3_alarm_3','alarmReceivedFromText') or '—' }}"

    # Alarm 4 – modtaget fra
    - name: "C3 alarm 4 modtaget fra"
      unique_id: c3_alarm_4_received_from
