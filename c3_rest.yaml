        {% set data = value_json if value_json is defined else [] %}
        {% set a = data[2] if (data is iterable and (data | length) > 2) else dict() %}
        {{ a.id if a is mapping and a.id is defined else 0 }}
      json_attributes_path: "$[2]"
      json_attributes:
        - id
        - alarmTime
        - address
        - alarmReceivedFromText
        - firstReportsWordingText
        - stationNames
        - vehicleNames

    - name: "C3 alarm 3"
      unique_id: c3_alarm_3
      value_template: >-
        {% set data = value_json if value_json is defined else [] %}
        {% set a = data[3] if (data is iterable and (data | length) > 3) else dict() %}
        {{ a.id if a is mapping and a.id is defined else 0 }}
      json_attributes_path: "$[3]"
      json_attributes:
        - id
        - alarmTime
        - address
        - alarmReceivedFromText
        - firstReportsWordingText
        - stationNames
        - vehicleNames

    - name: "C3 alarm 4"
      unique_id: c3_alarm_4
