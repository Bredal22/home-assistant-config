- sensor:
    # --- C3: sensorer pr. indeks ---

    # Alarm 0 - med selv-hold hvis data kortvarigt forsvinder
    - name: "C3 alarm 0 titel"
      unique_id: c3_alarm_0_title
      icon: mdi:alarm-light
      state: >-
        {% set a = state_attr('sensor.c3_alarm_0', 'firstReportsWordingText') %}
        {% if a not in [none, 'unknown', 'unavailable', ''] %}
          {{ a }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          Alarm #{{ states('sensor.c3_alarm_0') }}
        {% endif %}

    - name: "C3 alarm 0 adresse"
      unique_id: c3_alarm_0_address
      icon: mdi:map-marker
      state: >-
        {% set v = state_attr('sensor.c3_alarm_0', 'address') %}
        {% if v not in [none, 'unknown', 'unavailable', ''] %}
          {{ v }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    - name: "C3 alarm 0 stationer"
      unique_id: c3_alarm_0_stations
      icon: mdi:fire-station
      state: >-
        {% set v = state_attr('sensor.c3_alarm_0', 'stationNames') %}
        {% if v not in [none, 'unknown', 'unavailable', ''] %}
          {{ v }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    - name: "C3 alarm 0 køretøjer"
      unique_id: c3_alarm_0_vehicles
      icon: mdi:fire-truck
      state: >-
        {% set v = state_attr('sensor.c3_alarm_0', 'vehicleNames') %}
        {% if v not in [none, 'unknown', 'unavailable', ''] %}
          {{ v }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    - name: "C3 alarm 0 tidspunkt (lokal)"
      unique_id: c3_alarm_0_time_local
      icon: mdi:clock-outline
      state: >-
        {% set t = state_attr('sensor.c3_alarm_0', 'alarmTime') %}
        {% if t not in [none, 'unknown', 'unavailable', ''] %}
          {{ as_timestamp(t) | timestamp_custom("%Y-%m-%d %H:%M:%S", true) }}
        {% elif this is defined and this.state not in ['unknown', 'unavailable', '—'] %}
          {{ this.state }}
        {% else %}
          —
        {% endif %}

    - name: "C3 alarm 0 modtaget fra"
      unique_id: c3_alarm_0_received_from
      icon: mdi:phone-incoming
      state: "{{ state_attr('sensor.c3_alarm_0','alarmReceivedFromText') or '—' }}"

