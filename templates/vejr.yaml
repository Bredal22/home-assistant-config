- sensor:
    # --- Udendørs temperatur ---
    - name: "temperature_ext"
      unique_id: weather_home_temp
      device_class: temperature
      unit_of_measurement: "°C"
      state_class: measurement
      state: "{{ state_attr('weather.home', 'temperature') }}"
      availability: "{{ state_attr('weather.home', 'temperature') is not none }}"
      attributes:
        friendly_name: "Udendørs temperatur"

    # --- Udendørs luftfugtighed ---
    - name: "humidity_ext"
      unique_id: weather_home_humid
      device_class: humidity
      unit_of_measurement: "%"
      state_class: measurement
      state: "{{ state_attr('weather.home', 'humidity') }}"
      availability: "{{ state_attr('weather.home', 'humidity') is not none }}"
      attributes:
        friendly_name: "Udendørs luftfugtighed"
