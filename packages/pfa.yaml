yahoofinance:
  symbols:
    - "PFIGLA.CO"
    - "PFIBAA.CO"
  scan_interval:
    hours: 1
  show_trending_icon: true

template:
  - sensor:
      - name: "PFA"
        unique_id: pfa_total
        unit_of_measurement: "kr"
        state_class: measurement
        state: >-
          {{ (state_attr('sensor.yahoofinance_pfigla_co','regularMarketPrice') | float(0) * 606 )
             + (state_attr('sensor.yahoofinance_pfibaa_co','regularMarketPrice') | float(0) * 2089) }}
