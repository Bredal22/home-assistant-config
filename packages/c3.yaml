          {{ is_state('input_boolean.c3_enabled','on')
             and is_state('sensor.c3_access_token','OK')
             and states('sensor.c3_alarmer_antal') not in ['unknown','unavailable',''] }}

automation:
  - id: 5d8cdd0de7964cd996cc99e48d7bf80c
    alias: "C3: Opdater straks ved aktivering"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.c3_enabled
        from: "off"
        to: "on"
    conditions: []
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.c3_access_token
      - wait_template: >-
          {{ (state_attr('sensor.c3_access_token','access_token') | default('') | length) > 0 }}
        timeout: "00:00:10"
        continue_on_timeout: true
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.c3_alarmer_antal
            - sensor.c3_alarm_0
            - sensor.c3_alarm_1
            - sensor.c3_alarm_2
            - sensor.c3_deltid_seneste_aendring

  - id: 3ee036fe1df04b2e8add15f5ca73a328
    alias: "C3: Poll token (4 min)"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/4"
    conditions:
      - condition: state
        entity_id: input_boolean.c3_enabled
        state: "on"
      - condition: template
        value_template: "{{ states('sensor.c3_access_token') not in ['unknown','unavailable'] }}"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.c3_access_token

  - id: c3_update_token_on_start
    alias: C3 - Opdater token ved opstart
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.c3_enabled
        state: "on"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.c3_access_token

  - id: c3_update_alarms_every_30s
    alias: C3 - Opdater alarmer hvert 30. sekund
    mode: restart
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: state
        entity_id: input_boolean.c3_enabled
        state: "on"
      - condition: state
        entity_id: sensor.c3_access_token
        state: "OK"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.c3_access_token
      - wait_template: >-
          {{ (state_attr('sensor.c3_access_token','access_token') | default('') | length) > 0 }}
        timeout: "00:00:10"
        continue_on_timeout: true
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.c3_alarm_0
            - sensor.c3_deltid_seneste_aendring

  - id: "1763468099555"
    alias: Silkeborg – C3 alarm 0 notifikation
    description: Send notifikation når Silkeborg rykker ud på C3 alarm 0
    mode: parallel
    triggers:
      - trigger: state
        entity_id: sensor.c3_alarm_0_tidspunkt_lokal
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and
          trigger.to_state is not none and
          trigger.from_state.state not in ['unknown', 'unavailable', '—'] and
          trigger.to_state.state not in ['unknown', 'unavailable', '—'] }}
    actions:
      - wait_template: >-
          {{ 'Silkeborg' in (state_attr('sensor.c3_alarm_0', 'stationNames') or '') }}
        timeout: "00:06:00"
        continue_on_timeout: false
      - action: notify.mobile_app_sm_s938b
        data:
          title: >-
            🚒 {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }} kører
          message: >-
            {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }}
            kører til {{ states('sensor.c3_alarm_0_adresse') | default(states('sensor.c3_alarm_0_titel')) }}
            kl. {{ states('sensor.c3_alarm_0_tidspunkt_lokal') }}.

            Alarm: {{ states('sensor.c3_alarm_0_titel') }}
          data:
            ttl: 0
            priority: high
            channel: c3_standard
            clickAction: >-
              {% set dest = states('sensor.c3_alarm_0_adresse')
                if states('sensor.c3_alarm_0_adresse') not in ['—','unknown','unavailable','']
                else states('sensor.c3_alarm_0_titel') %}
              https://www.google.com/maps/dir/?api=1&destination={{ dest | urlencode }}

  - id: "1763468769647"
    alias: Alle stationer – C3 alarm 0 notifikation
    description: Send notifikation når C3 alarm 0 skifter til ny melding
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.c3_alarm_0_tidspunkt_lokal
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and
             trigger.to_state is not none and
             trigger.from_state.state not in ['unknown', 'unavailable', '—'] and
             trigger.to_state.state not in ['unknown', 'unavailable', '—'] }}
    actions:
      - action: notify.mobile_app_sm_s938b
        data:
          title: >-
            {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }} kører
          message: >-
            {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }}
            kører til {{ states('sensor.c3_alarm_0_adresse') | default(states('sensor.c3_alarm_0_titel')) }}
            kl. {{ states('sensor.c3_alarm_0_tidspunkt_lokal') }}.

            Alarm: {{ states('sensor.c3_alarm_0_titel') }}

  - id: "1763468099600"
    alias: Flag – Udkald Silkeborg
    description: Sæt input_boolean.udkald_silkeborg ved udkald til Silkeborg
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.c3_alarm_0_tidspunkt_lokal
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable', '—']
             and trigger.to_state.state not in ['unknown', 'unavailable', '—'] }}
    actions:
      - wait_template: >-
          {{ 'Silkeborg' in (state_attr('sensor.c3_alarm_0', 'stationNames') or '') }}
        timeout: "00:02:00"
        continue_on_timeout: false
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.udkald_silkeborg
      - delay: "00:00:10"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.udkald_silkeborg

  - id: "1763468099601"
    alias: Silkeborg udkald – Lys ved hoveddør og indkørsel
    description: Tænd lys ved udkald til Silkeborg når det er mørkt og jeg har vagt
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.udkald_silkeborg
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: sun.sun
        state: "below_horizon"
      - condition: state
        entity_id: switch.vagt
        state: "on"
    actions:
      - action: switch.turn_on
        target:
          entity_id:
            - switch.hoveddoer_og_carport
            - switch.indkoersel
      - delay: "00:05:00"
      - action: switch.turn_off
        target:
          entity_id:
            - switch.hoveddoer_og_carport
            - switch.indkoersel

  - id: "1764761193478"
    alias: "C3: Test send notifikation til telefon"
    description: Send notifikation når ny C3 alarm
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.c3_alarm_0_tidspunkt_lokal
    conditions: []
    actions:
      - action: notify.mobile_app_sm_s938b
        data:
          title: >-
            🚒 {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }} kører
          message: >-
            {{ states('sensor.c3_alarm_0_stationer') | default('Station ukendt') }}
            kører til {{ states('sensor.c3_alarm_0_adresse') | default(states('sensor.c3_alarm_0_titel')) }}
            kl. {{ states('sensor.c3_alarm_0_tidspunkt_lokal') }}.

            Alarm: {{ states('sensor.c3_alarm_0_titel') }}
          data:
            ttl: 0
            priority: high
            channel: c3_standard
            clickAction: >-
              {% set dest = states('sensor.c3_alarm_0_adresse')
                if states('sensor.c3_alarm_0_adresse') not in ['—','unknown','unavailable','']
                else states('sensor.c3_alarm_0_titel') %}
              https://www.google.com/maps/dir/?api=1&destination={{ dest | urlencode }}

  - id: c3_silkeborg_tts_koretid
    alias: Silkeborg udkald – TTS med køretid
    description: TTS 30 sek efter udkald (kræver vagt) med køretid til alarm-adresse
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.udkald_silkeborg
        from: "off"
        to: "on"
    conditions: []
    actions:
      - condition: or
        conditions:
          - condition: state
            entity_id: switch.vagt
            state: "on"
          - condition: state
            entity_id: input_boolean.vagt
            state: "on"
      - delay: "00:00:30"
      - condition: or
        conditions:
          - condition: state
            entity_id: switch.vagt
            state: "on"
          - condition: state
            entity_id: input_boolean.vagt
            state: "on"
      - variables:
          alarm_title: "{{ states('sensor.c3_alarm_0_titel') | default('ukendt alarm') }}"
          dest_addr: "{{ states('sensor.c3_alarm_0_adresse_waze') }}"
          alarm_address: >-
            {{ states('sensor.c3_alarm_0_adresse')
               if states('sensor.c3_alarm_0_adresse') not in ['—','unknown','unavailable','']
               else dest_addr }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ dest_addr not in ['—','unknown','unavailable',''] }}"
            sequence:
              - action: waze_travel_time.get_travel_times
                data:
                  region: "eu"
                  units: "metric"
                  vehicle_type: "car"
                  origin: zone.home
                  destination: "{{ dest_addr }}"
                  realtime: true
                response_variable: waze
              - variables:
                  drive_minutes: >-
                    {% set d = 0 %}
                    {% if waze is defined and waze.routes is defined and (waze.routes | count) > 0 %}
                      {% set d = waze.routes[0].duration | float(0) %}
                    {% endif %}
                    {{ d | round(0) | int(0) }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ drive_minutes > 0 }}"
                    sequence:
                      - action: notify.mobile_app_sm_s938b
                        data:
                          message: "TTS"
                          data:
                            tts_text: >-
                              Du kører til "{{ alarm_title }}". Adressen er {{ alarm_address }}.
                              Køretiden er {{ drive_minutes }} minutter.
                            media_stream: alarm_stream
                            ttl: 0
                            priority: high
                default:
                  - action: notify.mobile_app_sm_s938b
                    data:
                      message: "TTS"
                      data:
                        tts_text: >-
                          Du kører til "{{ alarm_title }}". Adressen er {{ alarm_address }}.
                          Køretiden er ukendt.
                        media_stream: alarm_stream
                        ttl: 0
                        priority: high
        default:
          - action: notify.mobile_app_sm_s938b
            data:
              message: "TTS"
              data:
                tts_text: >-
                  Du kører til "{{ alarm_title }}". Adressen er {{ alarm_address }}.
                  Køretiden er ukendt.
                media_stream: alarm_stream
                ttl: 0
                priority: high

  - id: c3_watchdog_fejl
    alias: C3 – watchdog ved fejl
    description: Giv besked hvis C3 har været nede i mindst 10 minutter
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.c3_ok
        to: "off"
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: input_boolean.c3_enabled
        state: "on"
    actions:
      - action: notify.mobile_app_sm_s938b
        data:
          title: "C3-fejl (watchdog)"
          message: >-
            C3 har været nede i mindst 10 minutter.
            Status: {{ states('sensor.c3_status') }}.
            Sidst opdateret: {{ state_attr('sensor.c3_sidst_opdateret', 'last_update_local') }}
      - action: persistent_notification.create
        data:
          title: "C3-fejl"
          message: >-
            C3 OK: {{ states('binary_sensor.c3_ok') }}
            Sidst opdateret: {{ state_attr('sensor.c3_sidst_opdateret', 'last_update_local') }}
