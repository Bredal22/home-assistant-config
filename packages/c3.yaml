          {% if a %}{{ a }}{% else %}Alarm #{{ states('sensor.c3_alarm_3') }}{% endif %}

      - name: "C3 alarm 3 adresse"
        unique_id: c3_alarm_3_address
        icon: mdi:map-marker
        state: "{{ state_attr('sensor.c3_alarm_3','address') or '—' }}"

      - name: "C3 alarm 3 stationer"
        unique_id: c3_alarm_3_stations
        icon: mdi:fire-station
        state: "{{ state_attr('sensor.c3_alarm_3','stationNames') or '—' }}"

