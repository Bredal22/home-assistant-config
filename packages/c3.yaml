          {% if t %}
            {{ as_timestamp(t) | timestamp_custom("%Y-%m-%d %H:%M:%S", true) }}
          {% else %}
            —
          {% endif %}

      - name: "C3 alarm 3 modtaget fra"
        unique_id: c3_alarm_3_received_from
        icon: mdi:phone-incoming
        state: "{{ state_attr('sensor.c3_alarm_3','alarmReceivedFromText') or '—' }}"

      # --- Alarm 4 ---
      - name: "C3 alarm 4 titel"
        unique_id: c3_alarm_4_title
        icon: mdi:alarm-light
        state: >-
          {% set a = state_attr('sensor.c3_alarm_4','firstReportsWordingText') %}
          {% if a %}{{ a }}{% else %}Alarm #{{ states('sensor.c3_alarm_4') }}{% endif %}

      - name: "C3 alarm 4 adresse"
        unique_id: c3_alarm_4_address
        icon: mdi:map-marker
        state: "{{ state_attr('sensor.c3_alarm_4','address') or '—' }}"

      - name: "C3 alarm 4 stationer"
        unique_id: c3_alarm_4_stations
        icon: mdi:fire-station
        state: "{{ state_attr('sensor.c3_alarm_4','stationNames') or '—' }}"

      - name: "C3 alarm 4 køretøjer"
        unique_id: c3_alarm_4_vehicles
        icon: mdi:fire-truck
        state: "{{ state_attr('sensor.c3_alarm_4','vehicleNames') or '—' }}"

      - name: "C3 alarm 4 tidspunkt"
