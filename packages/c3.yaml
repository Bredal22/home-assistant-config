input_boolean:
  c3_enabled:
    name: "C3 forespørgsler"
    icon: mdi:toggle-switch

  udkald_silkeborg:
    name: "Udkald Silkeborg"
    icon: mdi:alarm-light

rest:
  # --- C3: Access token ---
  - resource: !secret c3_token_url
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
      Accept: application/json
    payload: !secret c3_token_payload
    timeout: 20
    scan_interval: 86400
    sensor:
      - name: "C3 access token"
        unique_id: c3_access_token
        value_template: >-
          {% if value_json is defined
                and value_json.access_token is defined
                and (value_json.access_token | string | length) > 0 %}
            OK
          {% else %}
            FAIL
          {% endif %}
        json_attributes:
          - access_token
          - expires_in
          - token_type
          - error
          - error_description

  # --- C3: Hent alarmer ---
  - resource: "https://c3ng-fire-station-screen-latest-alarms-widget-api.rm-group.dk/LatestAlarms/63505d920f799a0cd5d39c80?c3ClassicOrganization=OrgMJBR&numberOfLatestAlarms=10"
    method: GET
    headers:
      Authorization: >-
        Bearer {{ state_attr('sensor.c3_access_token', 'access_token') }}
      User-Agent: "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:144.0) Gecko/20100101 Firefox/144.0"
      Accept-Language: "da,en-US;q=0.7,en;q=0.3"
      Accept: "application/json, text/plain, */*"
      Referer: "https://c3ng.rm-group.dk/"
      Origin: "https://c3ng.rm-group.dk"
    timeout: 20
    scan_interval: 86400
    sensor:
      - name: "C3 alarmer (antal)"
        unique_id: c3_alarms_count
        value_template: >-
          {% set data = value_json if value_json is defined else [] %}
          {{ (data | length) if data is iterable else 0 }}

      - name: "C3 alarm 0"
        unique_id: c3_alarm_0
        value_template: >-
          {% set data = value_json if value_json is defined else [] %}
          {% set a = data[0] if (data is iterable and (data | length) > 0) else dict() %}
          {{ a.id if a is mapping and a.id is defined else 0 }}
        json_attributes_path: "$[0]"
        json_attributes:
          - id
          - alarmTime
          - address
          - alarmReceivedFromText
          - firstReportsWordingText
          - stationNames
          - vehicleNames

      - name: "C3 alarm 1"
        unique_id: c3_alarm_1
        value_template: >-
          {% set data = value_json if value_json is defined else [] %}
          {% set a = data[1] if (data is iterable and (data | length) > 1) else dict() %}
          {{ a.id if a is mapping and a.id is defined else 0 }}
        json_attributes_path: "$[1]"
        json_attributes:
          - id
          - alarmTime
          - address
          - alarmReceivedFromText
          - firstReportsWordingText
          - stationNames
          - vehicleNames

      - name: "C3 alarm 2"
        unique_id: c3_alarm_2
        value_template: >-
          {% set data = value_json if value_json is defined else [] %}
          {% set a = data[2] if (data is iterable and (data | length) > 2) else dict() %}
          {{ a.id if a is mapping and a.id is defined else 0 }}
        json_attributes_path: "$[2]"
        json_attributes:
          - id
          - alarmTime
          - address
          - alarmReceivedFromText
          - firstReportsWordingText
          - stationNames
          - vehicleNames

      - name: "C3 alarm 3"
        unique_id: c3_alarm_3
        value_template: >-
          {% set data = value_json if value_json is defined else [] %}
          {% set a = data[3] if (data is iterable and (data | length) > 3) else dict() %}
          {{ a.id if a is mapping and a.id is defined else 0 }}
        json_attributes_path: "$[3]"
        json_attributes:
          - id
          - alarmTime
          - address
          - alarmReceivedFromText
          - firstReportsWordingText
          - stationNames
          - vehicleNames

      - name: "C3 alarm 4"
        unique_id: c3_alarm_4
        value_template: >-
          {% set data = value_json if value_json is defined else [] %}
          {% set a = data[4] if (data is iterable and (data | length) > 4) else dict() %}
          {{ a.id if a is mapping and a.id is defined else 0 }}
        json_attributes_path: "$[4]"
        json_attributes:
          - id
          - alarmTime
          - address
          - alarmReceivedFromText
          - firstReportsWordingText
          - stationNames
          - vehicleNames

  # --- C3: Deltid (seneste ændring) ---
  - resource: "https://c3ng-forms-widget-api.rm-group.dk/FilledForms?metaDataId=64cb70a2ed74aaa6ddb2e7ee&formId=647e1301614267e9e86daa01&page=1&limit=1&sortBy=LastUpdatedOn&sortReverse=True"
    method: GET
    headers:
      Authorization: >-
        Bearer {{ state_attr('sensor.c3_access_token', 'access_token') }}
      Accept: "application/json"
      User-Agent: "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:146.0) Gecko/20100101 Firefox/146.0"
      Referer: "https://c3ng.rm-group.dk/"
      Origin: "https://c3ng.rm-group.dk"
    timeout: 20
    scan_interval: 86400
    sensor:
      - name: "C3 deltid seneste ændring"
        unique_id: c3_deltid_lastupdated
        value_template: >-
          {{ value_json.data[0].lastUpdatedOn if value_json is mapping and value_json.data is defined and (value_json.data|length)>0 else 'unknown' }}
        json_attributes_path: "$.data[0].formJsonData.data"
        json_attributes:
          - holdleder
          - i11
          - chauffor
          - Rogdykker
          - Rogdykker1
          - chauffor1
          - Rogdykker2
          - chauffor5
          - Rogdykker3
          - chauffor7
          - Rogdykker8
          - Rogdykker9

template:
