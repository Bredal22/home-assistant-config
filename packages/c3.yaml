        icon: mdi:clock-outline
        state: >-
          {% set t = state_attr('sensor.c3_alarm_4','alarmTime') %}
          {% if t %}
            {{ as_timestamp(t) | timestamp_custom("%Y-%m-%d %H:%M:%S", true) }}
