            —
          {% endif %}

      - name: "C3 alarm 4 modtaget fra"
        unique_id: c3_alarm_4_received_from
        icon: mdi:phone-incoming
        state: "{{ state_attr('sensor.c3_alarm_4','alarmReceivedFromText') or '—' }}"

      # --- Status og opdateringstid ---
      - name: "C3 status"
        unique_id: c3_status
        icon: mdi:heart-pulse
        state: >-
          {% if is_state('input_boolean.c3_enabled','off') %}
            Pauset
          {% elif not is_state('sensor.c3_access_token', 'OK') %}
            Token ugyldigt
          {% elif states('sensor.c3_alarmer_antal') in ['unknown','unavailable',''] %}
            API fejl
          {% else %}
            {% set n = states('sensor.c3_alarmer_antal') | int(0) %}
            Data OK ({{ n }})
          {% endif %}
        attributes:
          ok: >-
            {{ is_state('input_boolean.c3_enabled','on')
               and is_state('sensor.c3_access_token','OK')
               and states('sensor.c3_alarmer_antal') not in ['unknown','unavailable',''] }}

      - name: "C3 sidst opdateret"
        unique_id: c3_last_update
        icon: mdi:update
        availability: "{{ states('sensor.c3_alarm_0') not in ['unknown','unavailable',''] }}"
        state: >-
          {% set alarm = states.sensor.c3_alarm_0 %}
          {% set last = alarm.last_updated if alarm is not none else none %}
          {% if last %}
            {% set diff = (now() - last).total_seconds() | int %}
            {% if diff < 60 %}
              mindre end 1 minut siden
            {% elif diff < 3600 %}
              {{ (diff // 60) }} minutter siden
            {% else %}
              {{ (diff // 3600) }} timer siden
            {% endif %}
          {% else %}
            ukendt
          {% endif %}
        attributes:
          friendly_name: "C3 sidst opdateret"
          last_update_local: >-
            {% set alarm = states.sensor.c3_alarm_0 %}
            {% set last = alarm.last_updated if alarm is not none else none %}
            {% if last %}
              {{ as_timestamp(last) | timestamp_custom("%Y-%m-%d %H:%M:%S", true) }}
            {% else %}
              ukendt
            {% endif %}

  - binary_sensor:
      - name: "C3 OK"
        unique_id: c3_ok
        device_class: connectivity
